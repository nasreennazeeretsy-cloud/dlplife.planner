<title>Digital Life Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: left rail on desktop, scrolling tab strip on phones, one column of cards. One accent per palette, neutrals tinted from the text color. */
:root{
  --bg:#eef2ea;--surface:#fbfdf8;--fg:#26332a;--accent:#5c8a62;--accent-fg:#ffffff;
  --good:#2f8f5b;--warn:#b7791f;--bad:#c4473d;
  --c1:#5b7fd6;--c2:#d9776a;--c3:#58a67a;--c4:#d9a441;--c5:#9a6fc4;--c6:#3fa3b5;
  --muted:color-mix(in srgb,var(--fg) 62%,var(--bg));
  --line:color-mix(in srgb,var(--fg) 13%,var(--bg));
  --soft:color-mix(in srgb,var(--fg) 5%,var(--surface));
  --tint:color-mix(in srgb,var(--accent) 15%,var(--surface));
  --f-disp:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-head:var(--f-disp);
  --pad:16px;--gap:14px;--fs:15px;--r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--surface:#1b261e;--fg:#e3eee4;--accent:#8fc397;--accent-fg:#0d1710;--good:#5fcf8f;--warn:#e0b04d;--bad:#ef7d72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a14;--surface:#1b261e;--fg:#e3eee4;--accent:#8fc397;--accent-fg:#0d1710;--good:#5fcf8f;--warn:#e0b04d;--bad:#ef7d72;color-scheme:dark}
html[data-dens="compact"]{--pad:10px;--gap:8px;--fs:13.5px;--r:8px}
html[data-dens="cozy"]{--pad:22px;--gap:18px;--fs:16px;--r:22px}
html[data-dens="editorial"]{--pad:14px;--gap:18px;--fs:15px;--r:0px;--f-head:'Fraunces',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:var(--fs)/1.45 var(--f-body);padding-block:12px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:700;line-height:1.1}
h2{font-size:1.05rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
small,.small{font-size:.82em}
.muted{color:var(--muted)}
b{font-weight:600}
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--gap)}
#nav{display:flex;gap:4px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;white-space:nowrap;color:var(--muted);text-decoration:none;font-weight:500;flex:none}
.tab:hover{background:var(--tint);color:var(--fg)}
.tab.on{background:var(--accent);color:var(--accent-fg)}
.tab.over,.panel.over{outline:2px dashed var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.ic.em{font-size:16px;line-height:18px;text-align:center}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;opacity:.7}
@media(min-width:900px){
  .app{grid-template-columns:210px minmax(0,1fr);align-items:start}
  #nav{flex-direction:column;top:12px;overflow:visible;padding:0;background:none}
  .tab{border-radius:var(--r)}
}
main{min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.pg{display:flex;flex-direction:column;gap:6px;padding:6px 0 4px}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nm{color:var(--accent)}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0}
html[data-dens="editorial"] .card,html[data-dens="editorial"] .panel{background:transparent;border:0;border-top:2px solid var(--fg);padding-inline:0}
.card>h2,.panel>h2,.hd{margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.hd{margin:0 0 10px}
.grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr))}
.span{grid-column:1/-1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:calc(var(--r)*.7);padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:3px 9px;font-size:.85em}
.btn.on{background:var(--tint);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r)*.6);padding:7px 10px;min-width:0;max-width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{width:100%;resize:vertical}
.inline{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{cursor:pointer;overflow-wrap:anywhere}
.row small{display:block}
.row.done .grow b{text-decoration:line-through;color:var(--muted)}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0;flex:none;cursor:pointer;position:relative}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--accent-fg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pill{display:inline-block;font-size:.76rem;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:500}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.acc{color:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);padding:10px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:calc(var(--r)*.8);background:var(--soft);color:inherit;text-decoration:none}
.tile:hover{border-color:var(--accent)}
.tile span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tile strong{font:700 1.5rem var(--f-disp);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile.bad strong{color:var(--bad)}
.tile.good strong{color:var(--good)}
.tabular,td,th,.num{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:4px 6px;font-weight:600}
td{padding:7px 6px;border-top:1px solid var(--line)}
td.r,th.r{text-align:right}
tr[data-a]{cursor:pointer}
tr[data-a]:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.ring text{font:700 .8rem var(--f-disp);fill:var(--fg)}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut .ct{font:700 1.4rem var(--f-disp);fill:var(--fg)}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg text{fill:var(--muted);font:11px var(--f-body)}
.chart{width:100%;height:auto;max-height:230px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cell{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--r)*.5);padding:4px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;font:inherit;color:inherit;cursor:pointer;text-align:left;min-width:0}
.cell:hover{border-color:var(--accent)}
.cell.today b{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px}
.cell.sel{background:var(--tint);border-color:var(--accent)}
.cell.blank{visibility:hidden}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%}
.cell small{color:var(--muted)}
.t-task{background:var(--c1)}.t-rep{background:var(--c3)}.t-rem{background:var(--c4)}.t-goal{background:var(--c5)}.t-sub{background:var(--c2)}.t-proj{background:var(--c6)}.t-trip{background:var(--c6)}.t-wed{background:var(--c2)}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.day{border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.day.today{border-color:var(--accent);background:var(--tint)}
.blk{border-left:3px solid var(--accent);background:var(--soft);padding:4px 8px;border-radius:0 6px 6px 0;cursor:pointer;font-size:.88rem;overflow-wrap:anywhere}
.blk small{display:block;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:hover{border-color:var(--accent)}
.scale{display:flex;gap:6px}
.scale button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 1rem var(--f-disp);cursor:pointer}
.scale button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld span{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{width:100%}
.fld input[type=checkbox]{width:20px}
.ovl{position:fixed;inset:0;background:rgba(10,12,10,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);color:var(--fg);border-radius:var(--r);padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mact{display:flex;gap:8px;align-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:60;font-weight:500;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--tint);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:var(--gap);align-items:start}
.pc{border:1px solid var(--line);border-radius:calc(var(--r)*.7);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.pc+.pc{margin-top:10px}
.big{font:700 2rem var(--f-disp);font-variant-numeric:tabular-nums}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.swb{display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-radius:calc(var(--r)*.7);padding:8px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.swb.on{border-color:var(--accent)}
.swb i{display:flex;height:20px;border-radius:5px;overflow:hidden}
.swb i u{flex:1}
.grid52{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
.grid52 button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 0;font:500 .8rem var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.grid52 button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tg{position:relative;width:42px;height:24px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex:none;padding:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.tg.on{background:var(--accent)}
.tg.on::after{left:21px}
.arr{display:inline-flex;gap:2px}
.panel.arrange{cursor:grab}
.big-time{font:700 2.6rem var(--f-disp);font-variant-numeric:tabular-nums}
.quote{font:500 1.15rem/1.35 var(--f-head);text-wrap:balance}
.wk{display:flex;gap:6px}
.wk button{flex:1;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:calc(var(--r)*.6);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:0}
.wk button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.wk button small{opacity:.8}
.sep{height:1px;background:var(--line);margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 '<section class="card" style="align-self:start"><div class="hd"><h2>Archive</h2></div><div class="tiles" style="margin-bottom:10px"><div class="tile"><span>Writing streak</span><strong>'+streak(function(x){return jHas(S.journal[x])})+'</strong></div><div class="tile"><span>Entries</span><strong>'+keys.length+'</strong></div><div class="tile"><span>Total words</span><strong>'+tw.toLocaleString()+'</strong></div></div><input type="search" id="jq" data-live="jq" value="'+esc(UI.jq)+'" placeholder="Search your entries" style="width:100%;margin-bottom:8px" aria-label="Search entries">'+
 (hits.length?'<ul class="list">'+hits.slice(0,30).map(function(k){var e=S.journal[k],sn=(e.text||e.hl||e.g1||'').slice(0,90);return '<li class="row"><div class="grow" '+A('jto',{d:k})+'><b>'+esc(fmtD(k,{weekday:'short',month:'short',day:'numeric',year:'numeric'}))+'</b><small class="muted">'+esc(sn)+(sn.length>=90?'…':'')+'</small></div>'+(e.mood?pill('Mood '+e.mood):'')+pill(words(e.text)+' w')+'</li>'}).join('')+'</ul>':empt(q?'No entries match.':'Your entries will collect here.'))+'</section></div>'};

/* ---------- medicine ---------- */
V.medicine=function(){var t=TODAY(),P=S.meds.pep,doses=[];
 S.meds.list.forEach(function(m){timesOf(m).forEach(function(x){doses.push({m:m,x:x})})});doses.sort(function(a,b){return a.x<b.x?-1:1});
 var adh=function(m){var tm=timesOf(m),exp=tm.length*7,got=0;for(var i=0;i<7;i++){var d=addD(t,-i);tm.forEach(function(x){if(S.meds.taken[d+'|'+m.id+'|'+x])got++})}return exp?Math.round(got/exp*100):0};
 var out='<div class="grid"><section class="card"><div class="hd"><h2>Today\'s doses</h2></div>'+(doses.length?'<div class="chips">'+doses.map(function(x){var k=t+'|'+x.m.id+'|'+x.x,on=!!S.meds.taken[k];return '<button class="chip'+(on?' on':'')+'" '+A('taken',{key:k})+' aria-pressed="'+on+'">'+esc(x.x)+' · '+esc(x.m.name)+(on?' ✓':'')+'</button>'}).join('')+'</div>':empt('Add a medication to see today\'s doses here.'))+'</section>'+
 '<section class="card"><div class="hd"><h2>Medications</h2>'+addBtn('med','+ Add','','sm')+'</div>'+(S.meds.list.length?'<ul class="list">'+S.meds.list.map(function(m){return '<li class="row"><div class="grow" '+A('edit',{k:'med',id:m.id})+'><b>'+esc(m.name)+' <span class="muted" style="font-weight:400">'+esc(m.strength)+'</span></b><small class="muted">'+esc(timesOf(m).join(', '))+(m.notes?' · '+esc(m.notes):'')+'</small></div>'+pill(adh(m)+'% this week',adh(m)>=80?'good':'')+'</li>'}).join('')+'</ul>':empt('Track medications, strengths and schedules.'))+'</section></div>'+
 '<section class="card"><div class="hd"><div><h2>Advanced peptide mode</h2><p class="small muted">Reconstitution maths, vials, dose log and protocols. Off unless you switch it on.</p></div><button class="tg'+(P.on?' on':'')+'" '+A('pep')+' aria-label="Peptide mode" aria-pressed="'+P.on+'"></button></div></section>';
 if(P.on){var c=UI.calc,conc=c.ml>0?c.mg*1000/c.ml:0,draw=conc>0?c.dose/conc:0,ns=nextSite(),vpast=function(v){var n=diffD(v.expiry,t);return n<0?pill('Expired','bad'):n<=3?pill('Expires in '+n+'d','warn'):pill('Use by '+fmtD(v.expiry))};
  out+='<div class="grid"><section class="card"><div class="hd"><h2>Reconstitution calculator</h2></div><div class="bar"><label class="fld"><span>Vial (mg)</span><input type="number" step="any" style="width:100px" data-bind="~|calc|mg" data-num="1" data-rr="1" value="'+esc(c.mg)+'"></label><label class="fld"><span>Water (mL)</span><input type="number" step="any" style="width:100px" data-bind="~|calc|ml" data-num="1" data-rr="1" value="'+esc(c.ml)+'"></label><label class="fld"><span>Dose (mcg)</span><input type="number" step="any" style="width:100px" data-bind="~|calc|dose" data-num="1" data-rr="1" value="'+esc(c.dose)+'"></label></div><div class="tiles" style="margin-top:10px"><div class="tile"><span>Concentration</span><strong>'+Math.round(conc)+' mcg/mL</strong></div><div class="tile"><span>Draw</span><strong>'+(Math.round(draw*1000)/1000)+' mL</strong></div><div class="tile"><span>On a U-100 syringe</span><strong>'+(Math.round(draw*100*10)/10)+' units</strong></div><div class="tile"><span>Doses per vial</span><strong>'+(c.dose>0?Math.floor(c.mg*1000/c.dose):0)+'</strong></div></div><p class="small muted" style="margin-top:8px">A planning aid only. Check every figure against your prescriber or pharmacist\'s instructions.</p></section>'+
  '<section class="card"><div class="hd"><h2>Compound library</h2>'+addBtn('compound','+ Add','','sm')+'</div>'+(P.compounds.length?'<ul class="list">'+P.compounds.map(function(x){return '<li class="row"><div class="grow" '+A('edit',{k:'compound',id:x.id})+'><b>'+esc(x.name)+'</b><small class="muted">'+esc(x.vial)+' mg vial'+(x.notes?' · '+esc(x.notes):'')+'</small></div></li>'}).join('')+'</ul>':empt('Keep your compounds and usual vial sizes here.'))+'</section>'+
  '<section class="card"><div class="hd"><h2>Vials and expiry</h2>'+addBtn('vial','+ Add','','sm')+'</div>'+(P.vials.length?'<ul class="list">'+P.vials.map(function(v){return '<li class="row"><div class="grow" '+A('edit',{k:'vial',id:v.id})+'><b>'+esc(v.name)+'</b><small class="muted">'+esc(v.mg)+' mg in '+esc(v.bac)+' mL · mixed '+esc(fmtD(v.mixed))+'</small></div>'+vpast(v)+'</li>'}).join('')+'</ul>':empt('Track reconstitution dates and use-by dates.'))+'</section>'+
  '<section class="card"><div class="hd"><h2>Dose log</h2>'+addBtn('dose','+ Log dose','','sm')+'</div><p class="small muted" style="margin-bottom:6px">Next site in rotation: <b>'+esc(ns)+'</b></p>'+(P.doses.length?'<ul class="list">'+P.doses.slice().sort(function(a,b){return a.date<b.date?1:-1}).slice(0,12).map(function(x){return '<li class="row"><div class="grow" '+A('edit',{k:'dose',id:x.id})+'><b>'+esc(x.name)+' · '+esc(x.mcg)+' mcg</b><small class="muted">'+esc(fmtD(x.date))+' · '+esc(x.site)+(x.note?' · '+esc(x.note):'')+'</small></div></li>'}).join('')+'</ul>':empt('Log each dose with its site so rotation is easy to follow.'))+'</section>'+
  '<section class="card"><div class="hd"><h2>Protocols and reminders</h2>'+addBtn('protocol','+ Add','','sm')+'</div>'+(P.protocols.length?'<ul class="list">'+P.protocols.map(function(x){return '<li class="row"><div class="grow" '+A('edit',{k:'protocol',id:x.id})+'><b>'+esc(x.name)+'</b><small class="muted">'+esc(x.compound)+' · '+esc(x.mcg)+' mcg · '+esc(x.freq)+(x.time?' · reminder '+esc(x.time):'')+'</small></div></li>'}).join('')+'</ul>':empt('Define a schedule and a reminder time.'))+'</section></div>'}
 return out};

/* ---------- settings ---------- */
V.preferences=function(){var s=S.set,dk=isDark(),tg=function(on,a){return '<button class="tg'+(on?' on':'')+'" '+a+' aria-pressed="'+on+'"></button>'},ch=function(k,cur,list){return '<div class="chips">'+list.map(function(o){return '<button class="chip'+(cur===o[0]?' on':'')+'" '+A('set',{k:k,v:o[0]})+'>'+o[1]+'</button>'}).join('')+'</div>'};
 var exp=JSON.stringify(S);
 return '<div class="grid"><section class="card"><div class="hd"><h2>Appearance</h2></div><div style="display:flex;flex-direction:column;gap:14px"><label class="fld"><span>Your name</span><input type="text" data-bind="set|name" value="'+esc(s.name)+'" placeholder="Shown in your greeting"></label>'+
 '<div><p class="small muted" style="margin-bottom:6px">Light or dark</p>'+ch('mode',s.mode,[['auto','Match device'],['light','Light'],['dark','Dark']])+'</div>'+
 '<div><p class="small muted" style="margin-bottom:6px">Theme</p><div class="sw">'+Object.keys(THEMES).map(function(n){var p=THEMES[n][dk?1:0];return '<button class="swb'+(s.theme===n?' on':'')+'" '+A('set',{k:'theme',v:n})+' aria-pressed="'+(s.theme===n)+'"><i><u style="background:'+p[0]+'"></u><u style="background:'+p[1]+'"></u><u style="background:'+p[3]+'"></u></i><span>'+esc(n)+'</span></button>'}).join('')+'</div></div>'+
 '<div><p class="small muted" style="margin-bottom:6px">Layout density</p>'+ch('dens',s.dens,[['comfortable','Comfortable'],['compact','Compact'],['cozy','Cozy'],['editorial','Editorial']])+'</div>'+
 '<div><p class="small muted" style="margin-bottom:6px">Tab icons</p>'+ch('icons',s.icons,[['line','Line'],['minimal','Minimal'],['emoji','Emoji']])+'</div></div></section>'+
 '<section class="card"><div class="hd"><h2>Tabs</h2></div><p class="small muted" style="margin-bottom:6px">Switch a tab off and it disappears everywhere, dashboard included. Drag in the sidebar or use the arrows to reorder.</p><ul class="list">'+s.order.map(function(id){return '<li class="row" draggable="true" data-dg="tabs" data-did="'+id+'">'+tg(tabOn(id),A('tabtog',{id:id})+' aria-label="Show '+esc(TITLE[id])+'"')+'<div class="grow" style="cursor:default"><b>'+esc(TITLE[id])+'</b></div><span class="arr"><button class="btn sm" '+A('move',{g:'tabsall',id:id,n:-1})+' aria-label="Move up">↑</button><button class="btn sm" '+A('move',{g:'tabsall',id:id,n:1})+' aria-label="Move down">↓</button></span></li>'}).join('')+'</ul></section>'+
 '<section class="card"><div class="hd"><h2>Bonus widgets</h2></div><p class="small muted" style="margin-bottom:6px">Switched-on widgets appear on your dashboard.</p><ul class="list">'+WIDGETS.map(function(w){return '<li class="row">'+tg(!!s.widgets[w[0]],A('wtog',{id:w[0]})+' aria-label="Show '+w[1]+'"')+'<div class="grow" style="cursor:default"><b>'+w[1]+'</b></div></li>'}).join('')+'</ul></section>'+
 '<section class="card"><div class="hd"><h2>General</h2></div><div style="display:flex;flex-direction:column;gap:12px"><label class="fld"><span>Currency symbol</span><input type="text" maxlength="4" style="width:90px" data-bind="set|cur" data-rr="1" value="'+esc(s.cur)+'"></label><label class="fld"><span>Categories (comma separated)</span><input type="text" data-c="cats" value="'+esc(S.cats.join(', '))+'"></label><label class="fld"><span>Family members (comma separated)</span><input type="text" data-c="members" value="'+esc(S.members.join(', '))+'" placeholder="Used to assign and filter tasks"></label>'+
 '<div class="row">'+tg(s.notif,A('notif'))+'<div class="grow" style="cursor:default"><b>Reminder alerts</b><small class="muted">One tap to allow. Reminders also show inside the app while it is open.</small></div></div><div class="row">'+tg(s.haptic,A('haptic'))+'<div class="grow" style="cursor:default"><b>Haptic feedback</b><small class="muted">A light buzz on taps, on phones that support it.</small></div></div></div></section>'+
 '<section class="card"><div class="hd"><h2>Your data</h2></div><p class="small muted" style="margin-bottom:8px">Everything is stored in this browser only. Export a copy to keep it safe or move it to another device.</p><textarea id="exp" rows="3" readonly aria-label="Exported data">'+esc(exp)+'</textarea><div class="bar" style="margin:8px 0 14px"><button class="btn" '+A('copy',{src:'exp'})+'>Copy export</button></div><textarea id="imp" rows="3" placeholder="Paste exported data here to restore it" aria-label="Import data"></textarea><div class="bar" style="margin-top:8px"><button class="btn" '+A('import')+'>Import</button>'+(S.sample?'':'<button class="btn" '+A('loadsample')+'>Load sample data</button>')+(UI.confirmErase?'<span class="small">This removes everything.</span><button class="btn danger" '+A('erase')+'>Yes, erase it</button><button class="btn ghost" '+A('noerase')+'>Keep it</button>':'<button class="btn danger" '+A('erase')+'>Erase everything</button>')+'</div></section></div>'};

/* ---------- boot ---------- */
var fired={};
function note(m){toast(m);buzz();if(S.set.notif&&window.Notification&&Notification.permission==='granted'){try{new Notification('Life Planner',{body:m})}catch(e){}}}
function tick(){var n=new Date(),t=ymd(n),hm=pad(n.getHours())+':'+pad(n.getMinutes());
 S.reminders.forEach(function(r){if(r.date===t&&r.time===hm&&!fired[r.id+t]){fired[r.id+t]=1;note('Reminder: '+r.title)}});
 S.meds.list.forEach(function(m){timesOf(m).forEach(function(x){var k=m.id+t+x;if(x===hm&&!S.meds.taken[t+'|'+m.id+'|'+x]&&!fired[k]){fired[k]=1;note('Time for '+m.name)}})});
 if(S.meds.pep.on)S.meds.pep.protocols.forEach(function(p){var k=p.id+t;if(p.time===hm&&!fired[k]){fired[k]=1;note('Protocol reminder: '+p.name)}})}
document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.live&&CH[el.dataset.live])CH[el.dataset.live](el.value)});
S=load();if(!S||!S.set){S=blank();seed()}else migrate();
UI={tab:'dashboard',calMonth:TODAY().slice(0,7),calSel:TODAY(),weekStart:mondayOf(TODAY()),mealWk:mondayOf(TODAY()),fitDay:TODAY(),jDay:TODAY(),jq:'',budId:null,tripId:null,taskF:{cat:'',status:'',owner:''},wMetric:'mood',arrange:false,focus:{left:1500,iv:null},calc:{mg:5,ml:2,dose:250},confirmErase:false};
(function(){var h=location.hash.slice(1);if(TAB_IDS.indexOf(h)>-1)UI.tab=h})();
render();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.set.mode==='auto')render()});new MutationObserver(function(){if(S.set.mode==='auto')render()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
setInterval(tick,30000);
})();
</script>
